apiVersion: v1
kind: Service

metadata:
    name: spring-app-service

spec:
    type: NodePort
    selector: 
        app: spring-app # lable을 가진 template를 찾는다
    ports:
        - protocol: TCP
          port: 8080 # nodePort로 접근 시 서비스 포트
          targetPort: 8080	# 서비스에서 파드로 접근 시 포트
          nodePort: 30000 # 사용자가 외부에서 접속 포트