<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        .container { width: 400px; margin: 50px auto; font-family: Arial; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>회원가입</h2>
    <p>등록된 회원 정보가 없습니다. 회원가입을 완료해 주세요.</p>

    <form action="/login/registerProc.do" method="post">
        <input type="hidden" name="provider" th:value="${provider}">
        <input type="hidden" name="providerId" th:value="${providerId}">

        <div class="form-group">
            <label>아이디</label>
            <input type="text" name="userId" value="">
        </div>

        <div class="form-group">
            <label>패스워드</label>
            <input type="password" name="passwd" value="test1234!">
        </div>

        <div class="form-group">
            <label>부서명</label>
            <input type="text" name="dept" value=" 부서명">
        </div>

        <div class="form-group">
            <label>휴대폰</label>
            <input type="text" name="mobile" value="010-1111-2222">
        </div>

        <div class="form-group">
            <label>이름</label>
            <input type="text" name="userName" th:value="${name}" required>
        </div>
        
        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email" th:value="${email}" readonly>
        </div>

        <button type="submit">회원가입 완료</button>
    </form>
</div>
</body>
</html>
