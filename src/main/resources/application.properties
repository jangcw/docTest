spring.application.name=dockerTest

server.port=8080

# Root \uc804\uccb4 \ub85c\uadf8 \ub808\ubca8 \uc124\uc815 (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO

# \ud2b9\uc815 \ud328\ud0a4\uc9c0\ubcc4 \ub85c\uadf8 \ub808\ubca8 \uc9c0\uc815
logging.level.com.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

api.server.url=http://localhost:8080

# \ucf58\uc194 \ub85c\uadf8 \ucd9c\ub825 \ud3ec\ub9f7 \uc9c0\uc815
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# \ub85c\uadf8 \ud30c\uc77c \uc800\uc7a5 \uc124\uc815 (\uc9c0\uc815\ud55c \uacbd\ub85c\uc5d0 \ub85c\uadf8 \ud30c\uc77c \uc0dd\uc131)
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
# OAuth2 \ubc0f Security \uad00\ub828 \uc0c1\uc138 \ub85c\uadf8 \ucd9c\ub825
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

# kubernetes\uc5d0\uc11c \uc0b4\uc544\uc788\ub294\uc9c0\ub97c \uccb4\ud06c
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# swaggerdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.demo
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url: true
springdoc.swagger-ui.display-request-duration: true
springdoc.swagger-ui.operations-sorter: alpha

# kafka \uc124\uc815
spring.kafka.bootstrap-servers=localhost:9092
#Consumer \uba54\uc11c\ub4dc\uac00 \uc815\uc0c1\uc801\uc73c\ub85c \ub05d\ub098\uba74 \ud574\ub2f9 Record\uc758 Offset\uc744 commit
spring.kafka.listener.ack-mode=record
# \uc624\ub958\uac00 \ubc1c\uc0dd \uc2dc DLT \ud1a0\ud53d \uc790\ub3d9 \uc0dd\uc131 \ud5c8\uc6a9
spring.kafka.admin.auto-create=true
#Consumer Group\uc5d0 \uc800\uc7a5\ub41c Offset\uc774 \uc5c6\uc744 \ub54c \uac00\uc7a5 \uc624\ub798\ub41c \uba54\uc2dc\uc9c0\ubd80\ud130 \uc77d\uaca0\ub2e4\ub294 \ub73b
spring.kafka.consumer.auto-offset-reset=earliest
#Kafka Consumer \uc790\uccb4\uac00 \uc8fc\uae30\uc801\uc73c\ub85c Offset\uc744 \uc790\ub3d9 commit\ud558\uc9c0 \uc54a\uace0 Spring Kafka\uac00 \uad00\ub9ac\ud558\uac8c \ub429
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


my.api.url=http://localhost

